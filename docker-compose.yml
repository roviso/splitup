# Production: `docker compose up -d --build` on the server.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://splitup:${POSTGRES_PASSWORD}@db:5432/splitup
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: splitup
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitup"]
      interval: 5s
      retries: 10

  # Automatic HTTPS for splitup.thimitech.com. Remove if the server already runs nginx/Traefik (see README).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
